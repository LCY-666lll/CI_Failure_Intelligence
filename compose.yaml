# 固定Compose项目名，使容器、网络和volume具有清晰的项目归属。
name: ci-failure-intelligence

services:
  backend:
    # 使用项目根目录的Dockerfile构建后端镜像。
    build:
      context: .
      dockerfile: Dockerfile

    image: ci-failure-intelligence-backend:local
    restart: unless-stopped

    # 运行时读取私有配置，不把.env复制进镜像。
    env_file:
      - .env

    environment:
      # 容器通过Compose服务名访问数据库和Redis。
      # 这里覆盖.env中的本机地址，不修改.env文件本身。
      CFI_POSTGRES_HOST: postgres
      CFI_POSTGRES_PORT: "5432"
      CFI_REDIS_HOST: redis
      CFI_REDIS_PORT: "6379"
      # 后端容器通过 Compose 服务名访问 Qdrant。
      CFI_QDRANT_URL: "http://qdrant:6333"
      # 对应下面只读挂载的容器内模型缓存目录。
      CFI_EMBEDDING_CACHE_DIR: "/app/data/local/embedding-models"
      # 复用后端进程的模型，每轮完成后等待5分钟再继续解析和索引。
      CFI_CI_PROCESSING_ENABLED: "true"

    volumes:
      # 直接读取准备好的完整模型缓存，不把模型复制进镜像。
      - type: bind
        source: ./data/local/embedding-models
        target: /app/data/local/embedding-models
        read_only: true
        bind:
          # 缓存目录遗漏时明确失败，避免自动创建空目录。
          create_host_path: false

    ports:
      # 保留现有Windows后端的8001，新容器通过8002访问。
      # 只映射到本机，当前不开放公网访问。
      - "127.0.0.1:8002:8000"

    depends_on:
      # Compose 启动 backend 前，需要等待 postgres 服务通过健康检查
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 只要求启动；运行期不可用仍由检索节点处理降级。
      qdrant:
        condition: service_started

    healthcheck:
      # 在后端容器内部发起HTTP请求，不依赖额外安装curl。
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

    # 加载本地模型后，依据已有 Linux 资源测试提高后端内存上限。
    mem_limit: 1g

    # 给Uvicorn时间结束请求并释放数据库、Redis客户端。
    stop_grace_period: 30s

  redis:
    image: redis:8.2.9-alpine

    # Docker或Redis意外退出后自动恢复；手工停止时保持停止。
    restart: unless-stopped

    ports:
      # 宿主机：只允许本机访问Redis，不向局域网或公网暴露端口。
      - "127.0.0.1:6379:6379"

    volumes:
      # 将项目中的Redis配置以只读方式挂载进容器。
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

      # 将Redis的/data目录保存到Docker持久化volume。
      - redis_data:/data

    secrets:
      # 密码文件将在容器中挂载为/run/secrets/redis_password。
      - redis_password

    # 先由Shell读取Docker secret并生成临时ACL文件，
    # 再交回官方docker-entrypoint启动Redis。
    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        set -eu

        password="$$(cat /run/secrets/redis_password)"

        printf 'user default off\nuser cfi_ingest on >%s ~cfi:nonce:* +ping +info +set +ttl\n' \
          "$$password" > /tmp/users.acl

        chmod 600 /tmp/users.acl
        chown redis:redis /tmp/users.acl

        exec /usr/local/bin/docker-entrypoint.sh \
          redis-server \
          /usr/local/etc/redis/redis.conf \
          --aclfile /tmp/users.acl

    healthcheck:
      # 使用实际受限用户完成PING，认证或ACL错误也会表现为不健康。
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$(cat /run/secrets/redis_password)"
          redis-cli --user cfi_ingest ping | grep -q PONG

      # 每5秒检查一次，每次最多等待3秒。
      interval: 5s
      timeout: 3s

      # Redis启动后的前5秒不累计失败次数。
      start_period: 5s

      # 连续失败5次后将容器标记为unhealthy。
      retries: 5

    # 最多给Redis 10秒完成关闭和AOF收尾。
    stop_grace_period: 10s

    # 限制整个容器内存；Redis数据集内部另有64MiB限制。
    mem_limit: 128m

  postgres:
    # 固定数据库和基础系统版本，避免开发环境随latest标签变化。
    image: postgres:18.6-alpine3.24

    # Docker或PostgreSQL意外退出后自动恢复；手工停止时保持停止。
    restart: unless-stopped

    ports:
      # 只允许本机FastAPI、pgAdmin和psql访问数据库。
      - "127.0.0.1:5432:5432"

    environment:
      # 空数据卷第一次启动时创建正式项目数据库。
      POSTGRES_DB: ci_failure_intelligence

      # 官方镜像会将该用户创建为超级用户，因此明确命名为管理账号。
      POSTGRES_USER: cfi_admin

      # 从Docker secret读取密码，不将真实密码写进Compose文件。
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

      # PostgreSQL 18在官方镜像中的实际数据目录。
      PGDATA: /var/lib/postgresql/18/docker

    volumes:
      # 挂载PostgreSQL 18的父数据目录，容器重建后继续使用原数据。
      - postgres_data:/var/lib/postgresql

    secrets:
      # 密码文件将在容器中挂载为/run/secrets/postgres_password。
      - postgres_password

    healthcheck:
      # 只检查服务器是否接受连接；真实密码认证稍后单独验证。
      test:
        - CMD-SHELL
        - pg_isready -U cfi_admin -d ci_failure_intelligence

      interval: 5s
      timeout: 3s

      # 首次初始化数据库期间暂不累计健康检查失败。
      start_period: 10s

      # 初始化较慢时最多允许连续检查失败10次。
      retries: 10

    # 给PostgreSQL提供独立共享内存，避免使用容器默认的较小容量。
    shm_size: 128m

    # 控制本机开发数据库的最大内存占用。
    mem_limit: 512m

    # 停止时给PostgreSQL时间完成事务回滚和数据落盘。
    stop_grace_period: 30s


  qdrant:
    # 使用本批已核对的服务端版本。
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped

    environment:
      # Compose从.env读取；缺失或为空时停止，避免无认证启动。
      QDRANT__SERVICE__API_KEY: ${CFI_QDRANT_API_KEY:?Set CFI_QDRANT_API_KEY in .env}

    ports:
      # REST接口只映射到本机，不开放公网。
      - "127.0.0.1:6333:6333"

    volumes:
      # 容器重建后继续保留向量索引。
      - qdrant_data:/qdrant/storage

    # 小数据集的初始保护上限，后续根据实测调整。
    mem_limit: 256m
    stop_grace_period: 30s

secrets:
  redis_password:
    # Redis本地开发密码只从被Git忽略的文件读取。
    file: ./.secrets/redis_password.txt

  postgres_password:
    # PostgreSQL本地开发密码只从被Git忽略的文件读取。
    file: ./.secrets/postgres_password.txt

volumes:
  # Docker负责创建和管理Redis持久化volume。
  redis_data:

  # PostgreSQL业务数据使用独立volume，不复用Spike项目的数据。
  postgres_data:

  # Qdrant派生检索索引使用独立数据卷。
  qdrant_data:
