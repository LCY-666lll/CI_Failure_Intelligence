# Redis必须在前台运行，进程生命周期由Docker负责管理。
daemonize no

# Redis监听容器内部网络；宿主机暴露范围后续由Compose端口映射控制。
bind 0.0.0.0

# 保留Redis保护模式，后续还会配置受限ACL用户和密码。
protected-mode yes

# Redis容器内部使用标准端口。
port 6379

# 持久化文件统一写入后续挂载的Docker volume。
dir /data

# 日志写入标准输出，由Docker负责收集。
logfile ""

# 输出常规运行信息，同时避免调试日志过多。
loglevel notice

# 首版只使用AOF，不同时维护RDB快照。
save ""

# 开启Append Only File，记录会改变Redis数据的命令。
appendonly yes

# 每秒将AOF缓冲区同步到磁盘，在性能和持久性之间取平衡。
appendfsync everysec

# nonce属于短期小数据，首版将Redis数据集上限设为64MiB。
maxmemory 64mb

# 内存不足时拒绝新写入，不得提前淘汰仍在有效期内的nonce。
maxmemory-policy noeviction