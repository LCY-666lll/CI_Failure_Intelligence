name: Backend CI

# 只处理 main 的直接推送、目标为 main 的 PR，以及手工触发。
# on:定义触发条件
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 限制 GitHub 自动生成的 GITHUB_TOKEN，只允许读取仓库内容。
permissions:
  contents: read

jobs:
  # Job ID 是 workflow 内部使用的稳定机器标识。
  backend_tests:
    name: Backend tests (Python 3.12)

    # 固定 Linux 系统版本，避免 ubuntu-latest 后续变化影响项目。
    runs-on: ubuntu-24.04

    steps:
      # 第一小批只验证 GitHub 已经成功创建并启动 Runner。
      - name: Confirm runner environment
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"

      # Runner 初始没有项目文件，必须先签出本次提交的仓库代码。
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # 显式激活项目要求的 Python 3.12，避免依赖 Runner 的默认版本。
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # 安装与本机验证版本一致的 uv，并启用 GitHub Actions 缓存。
      - name: Set up uv 0.13.5
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: true

      # 严格按照现有锁文件创建后端虚拟环境并安装依赖。
      - name: Sync backend dependencies
        run: uv sync --project backend --locked

      # 创建报告目录并运行完整后端测试，同时生成后续发送端需要的 JUnit XML。
      - name: Run backend tests
        id: backend_tests
        run: |
          mkdir -p reports
          uv run --project backend pytest backend/tests -q --junitxml=reports/backend-junit.xml

      # pytest 失败时独立保存原始 JUnit 报告，避免后续投递失败后证据丢失。
      - name: Upload failed backend test report
        # failure() 允许这个 Step 在前面发生失败后继续运行
        if: failure() && steps.backend_tests.conclusion == 'failure'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: backend-junit-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/backend-junit.xml
          if-no-files-found: error
          retention-days: 7

      # pytest 失败后，先判断本次运行是否具备安全投递条件。
      - name: Check CI failure delivery inputs
        id: delivery_check
        if: failure() && steps.backend_tests.conclusion == 'failure'
        shell: bash
        env:
          # 公网接入地址属于非敏感配置，后续在 Repository Variable 中设置。
          CFI_INGEST_URL: ${{ vars.CFI_INGEST_URL }}

          # HMAC 密钥属于敏感配置，只在当前 Step 中注入。
          CFI_INGEST_HMAC_SECRET: ${{ secrets.CFI_INGEST_HMAC_SECRET }}

          # pull_request 事件中，这个值表示来源仓库是否为 fork。
          CFI_HEAD_REPOSITORY_FORK: ${{ github.event.pull_request.head.repo.fork }}

        run: |
          if [[ ! -f "reports/backend-junit.xml" ]]; then
            echo "CI 失败投递准备失败：JUnit 报告不存在。" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$CFI_HEAD_REPOSITORY_FORK" == "true" ]]; then
            echo "should_send=false" >> "$GITHUB_OUTPUT"
            echo "检测到 fork PR：本次只保留 JUnit artifact，不向平台投递。"
            exit 0
          fi

          if [[ -z "$CFI_INGEST_URL" ]]; then
            echo "CI 失败投递配置错误：Repository Variable CFI_INGEST_URL 未配置。" >&2
            exit 1
          fi

          if [[ -z "$CFI_INGEST_HMAC_SECRET" ]]; then
            echo "CI 失败投递配置错误：Repository Secret CFI_INGEST_HMAC_SECRET 未配置。" >&2
            exit 1
          fi

          echo "should_send=true" >> "$GITHUB_OUTPUT"
          echo "CI 失败投递前置检查通过。"

      # 帮 Python 发送脚本填写一张 "CI 失败信息单"：只有前置检查明确允许发送时，才调用统一的 Python 发送端。
      - name: Send CI failure report
        if: >-
          failure() &&
          steps.backend_tests.conclusion == 'failure' &&
          steps.delivery_check.outputs.should_send == 'true'
        shell: bash
        env:
          # 接入地址来自仓库 Variable，HMAC 密钥来自仓库 Secret。
          CFI_INGEST_URL: ${{ vars.CFI_INGEST_URL }}
          CFI_INGEST_HMAC_SECRET: ${{ secrets.CFI_INGEST_HMAC_SECRET }}

          # pytest 在仓库根目录下生成的 JUnit XML 报告。
          CFI_JUNIT_XML_PATH: reports/backend-junit.xml

          # 数字 ID 用于稳定识别仓库，仓库全名用于展示。
          CFI_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          CFI_GITHUB_REPOSITORY: ${{ github.repository }}

          # run_id 标识本次 workflow run，run_attempt 标识它的第几次重跑。
          CFI_GITHUB_RUN_ID: ${{ github.run_id }}
          CFI_GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}

          # workflow 和 Job 字段用来定位具体失败任务。
          CFI_GITHUB_WORKFLOW_NAME: ${{ github.workflow }}
          CFI_GITHUB_JOB_KEY: ${{ github.job }}
          CFI_GITHUB_JOB_NAME: backend-tests-python-3.12

          # github.sha 对应实际测试的提交；PR 优先使用来源分支名。
          CFI_GITHUB_COMMIT_SHA: ${{ github.sha }}
          CFI_GITHUB_HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}

        # 仍然使用现有锁文件，然后执行已经在本机验证过的发送脚本。
        run: >-
          uv run
          --project backend
          --locked
          python scripts/ci/send_ci_failure.py
